name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VillageForge-v3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: village-forge-apk
          path: dist/VillageForge-v3.1.apk
          retention-days: 30
          if-no-files-found: error

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: village-forge-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on Android emulator and verify it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r dist/VillageForge-v3.1.apk
            adb logcat -c
            # phase=game fast-forwards past the title screen so the smoke test
            # exercises the live 3D world and HUD directly.
            adb shell am start -W -n com.villageforge/.MainActivity --es phase game
            sleep 20
            adb logcat -d > full_logcat.txt
            adb shell "pidof com.villageforge" | grep -qE "[0-9]" && echo "=== APP IS STILL RUNNING — pid check PASSED ===" || { echo "=== APP PROCESS DIED ==="; exit 1; }
            if grep -q "FATAL EXCEPTION" full_logcat.txt; then grep -A 40 "FATAL EXCEPTION" full_logcat.txt; exit 1; fi
            echo "=== NO FATAL EXCEPTIONS — smoke test PASSED ==="
            adb exec-out screencap -p > screen.png
            echo "=== SCREENCAP TAKEN ==="

      - name: Verify the 3D world actually renders colors (no all-white screen)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 ci/check_colors.py screen.png

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: full_logcat.txt
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screen.png
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build, emulator-test]
    if: ${{ !contains(github.event.head_commit.message, '[probe]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: village-forge-apk
          path: dist

      - name: Publish to GitHub Releases (tag v3.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.1 dist/VillageForge-v3.1.apk \
            --title "Village Forge v3.1 — The Wider Valley" \
            --notes "The Wider Valley — a bigger world, kept on a leash, and lit properly:

          - A BIGGER MAP: the valley floor nearly doubles (88 wide, 42 deep) with the town now dead-center, and rim mountains closing the view on every side — no more staring off the edge of the world
          - MINES BROUGHT CENTERWARD: the North Cut canyon and its seventeen veins move eight units south to hug the pass mouth, and the stockpiles now sit on the flat at every cut entrance
          - LIMITED PANNING: the camera's pan clamp now tracks your zoom level, so the frame always stays on the terrain no matter how far you zoom out or rotate your phone
          - INVISIBLE BARRIERS: steep slopes are now true walls — walkers slide along them instead of climbing the mountains, so nobody wanders off the curated bowl (old saves snap safely back onto standable ground)
          - BRIGHTER NIGHTS: the night floor rises from 0.42 to 0.55 with more ambient and a lighter moonlit sky (a deliberate, flagged deviation from spec §13.3 after on-device feedback), and torches now come out earlier at dusk
          - FIXED THE DARK RING: the sun's daily sweep now travels the camera's side (south-to-east) instead of the far side, so every building front, canyon wall, and rim you actually look at is key-lit instead of ambient-only shade
          - Save v5 reads straight through: rocks, trees, crew, and buildings all carry over, and saved bodies snap back onto standable ground" \
            || gh release upload v3.1 dist/VillageForge-v3.1.apk --clobber
