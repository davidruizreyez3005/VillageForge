name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VillageForge-v2.1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: village-forge-apk
          path: dist/VillageForge-v2.1.1.apk
          retention-days: 30
          if-no-files-found: error

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: village-forge-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on Android emulator and verify it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r dist/VillageForge-v2.1.1.apk
            adb logcat -c
            # phase=game fast-forwards past the title screen so the smoke test
            # exercises the live 3D world and HUD directly.
            adb shell am start -W -n com.villageforge/.MainActivity --es phase game
            sleep 20
            adb logcat -d > full_logcat.txt
            adb shell "pidof com.villageforge" | grep -qE "[0-9]" && echo "=== APP IS STILL RUNNING — pid check PASSED ===" || { echo "=== APP PROCESS DIED ==="; exit 1; }
            if grep -q "FATAL EXCEPTION" full_logcat.txt; then grep -A 40 "FATAL EXCEPTION" full_logcat.txt; exit 1; fi
            echo "=== NO FATAL EXCEPTIONS — smoke test PASSED ==="
            adb exec-out screencap -p > screen.png
            echo "=== SCREENCAP TAKEN ==="

      - name: Verify the 3D world actually renders colors (no all-white screen)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 ci/check_colors.py screen.png

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: full_logcat.txt
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screen.png
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build, emulator-test]
    if: ${{ !contains(github.event.head_commit.message, '[probe]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: village-forge-apk
          path: dist

      - name: Publish to GitHub Releases (tag v2.1.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.1.1 dist/VillageForge-v2.1.1.apk \
            --title "Village Forge v2.1.1 — Startup Crash Hotfix" \
            --notes "Fixes the blocker that stopped many devices from getting into the game.

          Fixed in v2.1.1:
          - LOADING SCREEN BLOCKER: entering a village could crash the app during the save-slot relaunch, leaving you stuck on the loading screen forever. The terrain's shared GPU buffer was being destroyed twice at activity teardown; teardown is now deduplicated and exception-hardened so it can never kill the process
          - CRASH ON EXIT: the same double-destroy crashed the app whenever the activity was destroyed (back press, slot switching). Both are fixed
          - The old Filament engine is now fully released BEFORE the new village activity starts, so low-RAM devices never run two 3D engines at once during the loading transition

          New in v2.1.1:
          - App icon: a proper Village Forge launcher icon (pickaxe over forge embers), including adaptive icons for modern launchers
          - True fullscreen: the status bar and navigation buttons are now hidden — swipe from an edge to peek them" \
            || gh release upload v2.1.1 dist/VillageForge-v2.1.1.apk --clobber
