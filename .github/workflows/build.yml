name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VillageForge-v3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: village-forge-apk
          path: dist/VillageForge-v3.0.apk
          retention-days: 30
          if-no-files-found: error

  emulator-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: village-forge-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on Android emulator and verify it stays alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r dist/VillageForge-v3.0.apk
            adb logcat -c
            # phase=game fast-forwards past the title screen so the smoke test
            # exercises the live 3D world and HUD directly.
            adb shell am start -W -n com.villageforge/.MainActivity --es phase game
            sleep 20
            adb logcat -d > full_logcat.txt
            adb shell "pidof com.villageforge" | grep -qE "[0-9]" && echo "=== APP IS STILL RUNNING — pid check PASSED ===" || { echo "=== APP PROCESS DIED ==="; exit 1; }
            if grep -q "FATAL EXCEPTION" full_logcat.txt; then grep -A 40 "FATAL EXCEPTION" full_logcat.txt; exit 1; fi
            echo "=== NO FATAL EXCEPTIONS — smoke test PASSED ==="
            adb exec-out screencap -p > screen.png
            echo "=== SCREENCAP TAKEN ==="

      - name: Verify the 3D world actually renders colors (no all-white screen)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 ci/check_colors.py screen.png

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: full_logcat.txt
          if-no-files-found: ignore

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: screen.png
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [build, emulator-test]
    if: ${{ !contains(github.event.head_commit.message, '[probe]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: village-forge-apk
          path: dist

      - name: Publish to GitHub Releases (tag v3.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.0 dist/VillageForge-v3.0.apk \
            --title "Village Forge v3.0 — The Premium Port" \
            --notes "The Premium Port — the Android build now runs the prototype's validated balance, number for number:

        - THE SPEC ECONOMY: Iron/Copper/Silver/Gold/Mythril (Crystal kept as an Android-exclusive sixth tier in the Hollow), 1:1 smelting, ingots 2/4/7/12/28 coins, and the five prototype products. Raw ore no longer sells — the market buys ingots and finished goods only
        - THE 16-UPGRADE TREE: Swift Boots through Crew Training with the prototype's exact costs, growth rates, and ore unlocks (Pickaxe Quality Lv 3/6/8 uncovers silver/gold/mythril, +4% double-ore per level)
        - THE FULL CREW: Miner, Carrier, Smelter, Lumberjack, Blacksmith, Merchant, plus Master Smith, Master Smelter, Pit Master and five ore specialists — automation that never outpaces you. Wages are real: paid every 60 seconds, and an unpaid crew downs tools
        - FURNACES AND LANES: hopper-and-tray smelting with the Furnace II precious/common tier split, the Great Bellows scale and the Bellows House x0.72, forge Lane A/Lane B with Twin Strike crits and the Trip Hammer's 0.4 tend floor
        - THE WOOD CHAIN: fellable timber, the sawmill (16s a plank, x0.65 under any millrace), and planks that feed the build ladder
        - THE EAST CUT: a second mine field that opens when the Pit Master is hired
        - THE FULL 172-PRESTIGE LADDER: two millraces, the Bellows House and the Trip Hammer on a real power budget, the seven-tier well (Stone Well through the Millpond Fountain), four distinct house tiers (Cottage, Dormer, Longhouse, Merchant's House), spec commission gates and bounties, the supply yard's material shop, and the corrected boons (wages, crew speed, storage, offline, renown)
        - SPEC RHYTHM: 480-second days with the 0.42 night floor and the Merchant's hours, offline progress at 50% throughput capped by Night Shift, the wheelbarrow capstone when Pack + Boots are maxed, and the fixed 45-degree/32-degree orthographic camera with double-tap recenter
        - SAVE V5: a full sanitize pass clamps every count against the caps the save's own upgrades allow; v1-v4 villages keep their purse, renown, prestige, buildings and crew" \
        || gh release upload v3.0 dist/VillageForge-v3.0.apk --clobber
