name: Lighting Probe (temporary)

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/kotlin/com/villageforge/config/LightingProbe.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cycle lighting presets and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.villageforge/.MainActivity
            sleep 14
            for k in $(seq 1 14); do adb exec-out screencap -p > probe_$k.png; sleep 6; done
            echo "=== PROBE CAPTURE DONE ==="

      - name: Upload probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighting-probe-shots
          path: probe_*.png
          if-no-files-found: error
